<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmera Falsa</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("dE244dq8weZCu5CiA"); 
        })();
    </script>

    <style>
        body { font-family: sans-serif; text-align: center; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        #fakeCamera { width: 320px; height: 240px; border: 2px solid #333; border-radius: 10px; overflow: hidden; position: relative; }
        /* A imagem que parece a câmera */
        #fakeVideoImage { width: 100%; height: 100%; object-fit: cover; }
        /* O botão */
        button { padding: 15px 30px; font-size: 16px; cursor: pointer; margin-top: 20px; background: #ff0000; color: white; border: none; border-radius: 50px; width: 200px; }
        #status { margin-top: 10px; color: #aaa; }
    </style>
</head>
<body>

    <div>
        <!-- Substitua o src pela imagem que você quer que pareça a câmera -->
        <div id="fakeCamera">
            <img id="fakeVideoImage" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-4.0.3&auto=format&fit=crop&w=320&q=80" alt="Câmera">
        </div>
        
        <button id="btnFoto">📸 Tirar Foto</button>
        <p id="status"></p>
    </div>

    <script type="text/javascript">
        const IMGBB_API_KEY = '150c23d157fe7a469ffa4316f840df88'; 
        const EMAILJS_SERVICE_ID = 'service_1tsipns';
        const EMAILJS_TEMPLATE_ID = 'template_38m07j9';
        const EMAILJS_PUBLIC_KEY = 'dE244dq8weZCu5CiA'; 

        const btn = document.getElementById('btnFoto');
        const status = document.getElementById('status');
        const fakeImg = document.getElementById('fakeVideoImage');

        btn.onclick = async function() {
            btn.disabled = true;
            status.innerText = "Enviando foto...";

            // 1. Pegar a imagem da "câmera falsa" e converter para Base64
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Definir tamanho do canvas igual ao da imagem
            canvas.width = fakeImg.naturalWidth;
            canvas.height = fakeImg.naturalHeight;
            
            // Desenhar a imagem no canvas
            ctx.drawImage(fakeImg, 0, 0);
            
            // Converter para Base64
            const fotoBase64 = canvas.toDataURL('image/jpeg').split(',')[1];

            try {
                // 2. Enviar para o ImgBB
                const formData = new FormData();
                formData.append('image', fotoBase64);
                
                const responseImgbb = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                const dataImgbb = await responseImgbb.json();
                
                if (!dataImgbb.success) {
                    throw new Error('Falha no ImgBB');
                }

                const imageUrl = dataImgbb.data.url;
                const imageDeleteUrl = dataImgbb.data.delete_url;

                status.innerText = "Enviando e-mail...";

                // 3. Enviar e-mail
                const params = {
                    link_da_foto: imageUrl,
                    link_exclusao: imageDeleteUrl,
                    message: "Nova foto recebida."
                };

                const responseEmail = await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params);
                
                status.innerText = "Sucesso!";
                console.log('Success!', responseEmail.status);

            } catch (error) {
                console.error('Erro:', error);
                status.innerText = "Erro ao enviar.";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
