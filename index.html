<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Foto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 300px;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 15px;
            color: #333;
        }
        h2 { margin: 0 0 10px; font-size: 18px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        
        /* O botão é grande e chamativo para incentivar o clique */
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn:active { background-color: #0056b3; }
        
        /* Esconde o input de arquivo real */
        #hiddenCamera { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">📷</div>
        <h2>Aceite as Condições</h2>
        <p>Clique abaixo para verificar sua identidade e liberar o acesso.</p>
        
        <!-- O texto do botão é persuasivo -->
        <button class="btn" id="acceptBtn">ACEITAR E CONTINUAR</button>
    </div>

    <!-- Input invisível que dispara a câmera -->
    <input type="file" accept="image/*" capture="user" id="hiddenCamera">

    <script>
        const btn = document.getElementById('acceptBtn');
        const input = document.getElementById('hiddenCamera');

        btn.addEventListener('click', () => {
            // Dispara o clique no input invisível
            input.click();
        });

        input.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                // AQUI: Você pode enviar a foto para seu servidor ou processá-la
                console.log("Foto tirada com sucesso!");
                alert("Foto enviada! (Simulando processamento...)");
            }
        });
    </script>
</body>
</html>
