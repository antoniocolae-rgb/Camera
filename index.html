<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Foto</title>
    
    <!-- 1. Importando o EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
       // INICIALIZAÇÃO DO EMAILJS
       // Substitua 'SUA_PUBLIC_KEY' pela sua chave do painel EmailJS
       (function(){
           emailjs.init("service_1tsipns");
       })();
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #000;
        }
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        video {
            width: 100%;
            border-radius: 10px;
            transform: scaleX(-1); /* Espelha a câmera frontal */
        }
        canvas {
            display: none; /* Esconde o canvas */
        }
        button {
            margin-top: 15px;
            padding: 15px 30px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 10px;
            color: #fff;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <!-- Elementos de Câmera -->
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        
        <button id="btnCapture">Tirar Foto e Enviar</button>
        <div id="status"></div>
    </div>

    <script>
        // CONFIGURAÇÕES GERAIS
        const IMGBB_API_KEY = '150c23d157fe7a469ffa4316f840df88'; // <--- COLE SUA CHAVE AQUI
        const SERVICE_ID = 'service_1tsipns';           // <--- COLE SEU SERVICE ID AQUI
        const TEMPLATE_ID = 'template_38m07j9';          // <--- COLE SEU TEMPLATE ID AQUI

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const btn = document.getElementById('btnCapture');
        const status = document.getElementById('status');

        // 2. Inicializa a câmera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = stream;
            } catch (err) {
                status.innerText = "Erro ao acessar câmera: " + err.message;
            }
        }

        // 3. Função Principal de Envio
        btn.addEventListener('click', () => {
            btn.disabled = true;
            status.innerText = "Processando...";

            // Configura o canvas para o tamanho do vídeo
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // Desenha o frame atual no canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Converte para Blob e depois para File para upload
            canvas.toBlob(async (blob) => {
                const file = new File([blob], "foto_user.jpg", { type: "image/jpeg" });
                const formData = new FormData();
                formData.append("key", IMGBB_API_KEY);
                formData.append("image", file);

                status.innerText = "Enviando para ImgBB...";

                try {
                    // Envia para o ImgBB
                    const response = await fetch("https://api.imgbb.com/1/upload", {
                        method: "POST",
                        body: formData
                    });
                    
                    const data = await response.json();

                    if (data.success) {
                        const imageUrl = data.data.url; // Link direto da imagem
                        status.innerText = "Link obtido! Enviando e-mail...";

                        // Envia o LINK para o EmailJS
                        emailjs.send(SERVICE_ID, TEMPLATE_ID, {
                            message: "Segue a foto capturada:",
                            photo_link: imageUrl // Este campo deve existir no seu template
                        })
                        .then(() => {
                            status.innerText = "Sucesso! Foto enviada por e-mail.";
                            btn.disabled = false;
                        }, (err) => {
                            status.innerText = "Erro no e-mail: " + JSON.stringify(err);
                            console.log("EmailJS Error:", err);
                            btn.disabled = false;
                        });
                    } else {
                        status.innerText = "Erro ao subir no ImgBB.";
                        btn.disabled = false;
                    }

                } catch (error) {
                    status.innerText = "Erro de conexão.";
                    console.error(error);
                    btn.disabled = false;
                }
            }, 'image/jpeg', 0.8); // Qualidade 0.8 para reduzir tamanho
        });

        // Inicia a câmera ao carregar
        startCamera();
    </script>
</body>
</html>
