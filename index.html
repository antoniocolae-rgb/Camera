<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfie para E-mail</title>
    <!-- Importa a biblioteca do EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            color: white;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        button {
            position: absolute;
            bottom: 30px;
            padding: 15px 30px;
            font-size: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 10;
        }
        #status {
            position: absolute;
            top: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <button id="snap">📸 Enviar para E-mail</button>
    <div id="status"></div>

    <script>
        // --- CONFIGURAÇÃO DO EMAILJS ---
        // Substitua pelos seus dados do painel EmailJS
        const EMAILJS_PUBLIC_KEY = "SEU_PUBLIC_KEY"; 
        const EMAILJS_SERVICE_ID = "SEU_SERVICE_ID";
        const EMAILJS_TEMPLATE_ID = "SEU_TEMPLATE_ID";

        emailjs.init(EMAILJS_PUBLIC_KEY);

        const video = document.getElementById('video');
        const snap = document.getElementById('snap');
        const statusDiv = document.getElementById('status');

        function showStatus(msg) {
            statusDiv.textContent = msg;
            statusDiv.style.display = 'block';
            setTimeout(() => statusDiv.style.display = 'none', 3000);
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Erro ao acessar câmera.");
            }
        }

        snap.addEventListener('click', async () => {
            snap.disabled = true;
            showStatus("Enviando...");

            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Espelha a imagem
            context.translate(canvas.width, 0);
            context.scale(-1, 1);
            context.drawImage(video, 0, 0);

            // Converte para base64 (formato de imagem para e-mail)
            const imageData = canvas.toDataURL('image/jpeg', 0.8);
            const fileName = "selfie_" + new Date().getTime() + ".jpg";

            try {
                // Envia para o EmailJS
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    to_email: "seuemail@gmail.com", // Se quiser definir um email fixo no JS
                    from_name: "Usuário da App",
                    image: imageData, // O template deve ter uma variável {{image}}
                    message: "Aqui está a foto capturada:"
                });
                
                showStatus("✅ Foto enviada com sucesso!");
            } catch (error) {
                console.error('Erro:', error);
                showStatus("❌ Erro ao enviar: " + error.text);
            } finally {
                snap.disabled = false;
            }
        });

        startCamera();
    </script>

</body>
</html>
