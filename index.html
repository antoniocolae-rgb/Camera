<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmera Frontal Automática</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            color: white;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Espelha a imagem como uma câmera frontal */
        }
        button {
            position: absolute;
            bottom: 30px;
            padding: 15px 30px;
            font-size: 20px;
            background-color: rgba(0, 123, 255, 0.8);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 10;
        }
        img {
            display: none;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <button id="snap">📸 Tirar Foto</button>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const snap = document.getElementById('snap');

        // Tenta acessar a câmera frontal imediatamente
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'user', // Frontal
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    } 
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Permissão de câmera necessária. Ative-a nas configurações do navegador.");
            }
        }

        // Inicia a câmera assim que a página carrega
        startCamera();

        // Tira a foto ao clicar
        snap.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            
            // Define o tamanho do canvas
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Espelha a imagem para ficar natural (como uma câmera frontal)
            context.translate(canvas.width, 0);
            context.scale(-1, 1);

            // Desenha a imagem
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Converte para imagem e baixa automaticamente
            const data = canvas.toDataURL('image/png');
            
            // Cria um link de download invisível
            const link = document.createElement('a');
            link.href = data;
            link.download = 'selfie_' + new Date().getTime() + '.png';
            link.click();
        });
    </script>

</body>
</html>
