<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmera Frontal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
            color: white;
        }
        video {
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
            background-color: #000;
        }
        canvas {
            display: none; /* Esconde o canvas, só usamos para processar */
        }
        img {
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
            margin-top: 10px;
            border: 2px solid white;
        }
        button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:active {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <button id="snap">Tirar Foto</button>
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="photo" alt="Sua foto aparecerá aqui">

    <script>
        // Seleciona os elementos
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photo = document.getElementById('photo');
        const snap = document.getElementById('snap');

        // Configurações da câmera
        const constraints = {
            audio: false,
            video: {
                facingMode: 'user' // 'user' = frontal, 'environment' = traseira
            }
        };

        // Acessa a câmera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
            } catch (err) {
                alert("Erro ao acessar a câmera: " + err.message);
            }
        }

        // Tira a foto
        snap.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            
            // Define o tamanho do canvas igual ao do vídeo
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Desenha o frame atual do vídeo no canvas
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Converte para imagem e exibe
            const data = canvas.toDataURL('image/png');
            photo.setAttribute('src', data);
        });

        // Inicia a câmera ao carregar a página
        startCamera();
    </script>

</body>
</html>
